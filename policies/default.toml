# Guardrail default policy.
#
# Rules are checked in order. The first rule whose tool and matcher both
# apply decides the outcome. If no rule matches, default_decision applies.
#
# Each rule:
#   name      unique identifier, used in audit records
#   tool      the tool name this rule applies to (exact match)
#   matcher   a detector built into guardrail (see matchers.py)
#   params    optional settings for that matcher
#   decision  allow | block | dry_run | escalate
#   reason    explanation recorded with every decision this rule makes
#
# Shell rules see through wrappers (sudo, env, nohup, timeout, ...) and
# `sh -c "..."` nesting. They are pattern-based, so they reduce risk rather
# than prove a command safe. Calls that match no rule are allowed.

default_decision = "allow"

[[rules]]
name = "block-recursive-forced-rm-of-root"
tool = "shell"
matcher = "shell.rm_recursive_force"
params = { targets = ["/", "/*", "/bin", "/boot", "/etc", "/home", "/home/*", "/lib", "/root", "/sbin", "/usr", "/var", "~", "~/", "~/*", "$HOME", "$HOME/", "$HOME/*"] }
decision = "block"
reason = "recursive forced delete of the filesystem root or a system or home directory"

[[rules]]
name = "block-find-delete"
tool = "shell"
matcher = "shell.find_destructive"
decision = "block"
reason = "find that deletes files (-delete, or rm through -exec)"

[[rules]]
name = "block-disk-overwrite"
tool = "shell"
matcher = "shell.dd_to_device"
decision = "block"
reason = "dd writing to a device file"

[[rules]]
name = "block-redirect-to-device"
tool = "shell"
matcher = "shell.write_to_device"
decision = "block"
reason = "shell redirect writing to a device file"

[[rules]]
name = "block-format-filesystem"
tool = "shell"
matcher = "shell.program_in"
params = { programs = ["mkfs"], prefixes = ["mkfs."] }
decision = "block"
reason = "creating a filesystem, which destroys existing data"

[[rules]]
name = "block-power-off"
tool = "shell"
matcher = "shell.program_in"
params = { programs = ["shutdown", "reboot", "halt", "poweroff"] }
decision = "block"
reason = "shutting down or rebooting the machine"

[[rules]]
name = "block-recursive-permission-change-on-root"
tool = "shell"
matcher = "shell.recursive_on_targets"
params = { programs = ["chmod", "chown"], targets = ["/", "/*", "/etc", "/usr", "/var", "/home", "~", "~/", "$HOME"] }
decision = "block"
reason = "recursive permission or ownership change on a system directory"

[[rules]]
name = "block-fork-bomb"
tool = "shell"
matcher = "shell.fork_bomb"
decision = "block"
reason = "fork bomb, which exhausts processes"

[[rules]]
name = "block-terraform-destroy"
tool = "terraform"
matcher = "terraform.action_is"
params = { actions = ["destroy"] }
decision = "block"
reason = "terraform destroy is not allowed through the guardrail"

[[rules]]
name = "block-terraform-apply-without-plan"
tool = "terraform"
matcher = "terraform.apply_without_plan"
decision = "block"
reason = "terraform apply requires a saved plan file that was reviewed first"

# Rules are checked in order, so apply without a plan is blocked above before this is reached.
[[rules]]
name = "escalate-terraform-apply"
tool = "terraform"
matcher = "terraform.action_is"
params = { actions = ["apply"] }
decision = "escalate"
reason = "terraform apply of a saved plan needs a person to approve it"
