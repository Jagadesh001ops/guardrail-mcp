[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrail-mcp"
version = "0.1.0"
description = "A guardrail/decision layer between AI agents and the tools they call over MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
guardrail-mcp = "guardrail.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
